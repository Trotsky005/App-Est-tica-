<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B02D58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-180.png">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<title>Agenda Unhas &amp; Estética</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: app de uma tela — cabeçalho fixo, conteúdo rolável, barra de abas embaixo, folhas que sobem do rodapé */
:root{
  --bg:#F7F3F6; --surface:#FFFFFF; --surface2:#F0E9EE; --line:#E3D9E0;
  --fg:#261B28; --muted:#75667A;
  --accent:#B02D58; --accent-fg:#FFFFFF; --accent-soft:#F6E0E8;
  --ok:#2B7868; --ok-soft:#DCEFEA; --warn:#9C600C; --warn-soft:#FAEAD2; --bad:#B13838; --bad-soft:#F8E0E0;
  --shadow:0 10px 34px rgba(38,27,40,.16);
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141016; --surface:#1E1721; --surface2:#29212C; --line:#3A303D;
  --fg:#F3ECF4; --muted:#A796AB;
  --accent:#EE7299; --accent-fg:#1C0E14; --accent-soft:#3C1F2B;
  --ok:#5EC4AE; --ok-soft:#163430; --warn:#E9AA4C; --warn-soft:#392912; --bad:#F27E7E; --bad-soft:#3E1D1F;
  --shadow:0 10px 34px rgba(0,0,0,.55); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141016; --surface:#1E1721; --surface2:#29212C; --line:#3A303D;
  --fg:#F3ECF4; --muted:#A796AB;
  --accent:#EE7299; --accent-fg:#1C0E14; --accent-soft:#3C1F2B;
  --ok:#5EC4AE; --ok-soft:#163430; --warn:#E9AA4C; --warn-soft:#392912; --bad:#F27E7E; --bad-soft:#3E1D1F;
  --shadow:0 10px 34px rgba(0,0,0,.55); color-scheme:dark;}

html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 16px 8px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.top .brand{min-width:0;flex:1}
.top .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1{font-size:22px;line-height:1.15}
.whoami{font-size:12px;color:var(--muted);background:var(--surface2);border-radius:99px;padding:5px 10px;white-space:nowrap;max-width:45%;overflow:hidden;text-overflow:ellipsis}

main{padding:14px 16px 110px;max-width:860px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:12px;position:relative;cursor:pointer}
.tab svg{width:23px;height:23px}
.tab[aria-current="page"]{color:var(--accent)}
.tab[aria-current="page"] svg{transform:translateY(-1px)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-fg);font-size:10.5px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg);min-height:44px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.btn.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 11px;font-size:13.5px;border-radius:10px}
.btn.wide{width:100%}
.btn svg{width:18px;height:18px;flex:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-title{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec-title .count{background:var(--surface2);color:var(--fg);border-radius:99px;padding:1px 8px;letter-spacing:0;font-size:12px}

.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:600;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.li:first-child{border-top:0}
.li .t{font-weight:600}
.li .s{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);flex:none}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:17px;margin-bottom:4px}

/* Agenda */
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datebar .lbl{flex:1;min-width:0;text-align:center;border:0;background:none;cursor:pointer;padding:4px}
.datebar .lbl b{display:block;font-family:var(--f-display);font-size:19px;line-height:1.2}
.datebar .lbl span{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--surface2);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-top:10px}
.tl{display:flex;min-width:100%}
.tl-hours{flex:none;width:44px;position:relative;border-right:1px solid var(--line)}
.tl-hours span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.tl-col{flex:1;min-width:150px;border-right:1px solid var(--line)}
.tl-col:last-child{border-right:0}
.tl-head{height:36px;display:flex;align-items:center;gap:6px;padding:0 8px;font-weight:700;font-size:13px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tl-body{position:relative;cursor:copy;background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--hour))}
.tl-off{position:absolute;left:0;right:0;background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,transparent 6px 12px);display:flex;align-items:flex-start;justify-content:center;font-size:11.5px;color:var(--muted);font-weight:600;padding-top:3px;pointer-events:none}
.tl-at{position:absolute;left:4px;right:4px;border-radius:9px;background:color-mix(in srgb,var(--c) 18%,var(--surface));border-left:4px solid var(--c);padding:3px 7px;overflow:hidden;cursor:pointer;font-size:12.5px;line-height:1.25;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.tl-at b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-at .m{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-at.cancelado,.tl-at.faltou{opacity:.55}
.tl-at.cancelado b{text-decoration:line-through}
.tl-now{position:absolute;left:0;right:0;height:2px;background:var(--accent);pointer-events:none}
.tl-now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
.week{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.wday-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border:0;background:none;width:100%;text-align:left;cursor:pointer}
.wday-h b{font-family:var(--f-display);font-size:16px}
.wday.today .wday-h b{color:var(--accent)}
.wrow{display:flex;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.wrow .h{width:44px;flex:none;font-weight:700}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:25;border:0;background:var(--accent);color:var(--accent-fg);border-radius:18px;padding:0 18px;height:54px;font-weight:700;font-size:15.5px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow);cursor:pointer}
.fab svg{width:22px;height:22px}

/* Mensagens */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.msg.late{border-color:var(--warn)}
.msg .txt{font-size:13.5px;color:var(--muted);background:var(--surface2);border-radius:10px;padding:8px 10px;white-space:pre-wrap;max-height:96px;overflow:auto}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap}

/* Financeiro */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi .k{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:24px;line-height:1.2;margin-top:2px}
.kpi.hl{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.kpi.hl .k{color:inherit;opacity:.75}
.tbl-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
thead th{border-top:0;font-size:12px;color:var(--muted);font-weight:700}
td.r,th.r{text-align:right}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}

/* Folha */
#sheetWrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(15,8,16,.45)}
.sheet{position:relative;background:var(--bg);width:100%;max-width:640px;max-height:92%;border-radius:22px 22px 0 0;overflow:auto;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
.sh-head h2{font-size:21px;flex:1;min-width:0}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.lb{font-size:12.5px;font-weight:700;color:var(--muted)}
.inp{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 12px;min-height:44px;width:100%}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2>*{min-width:0}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:6px}
.slot{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 0;text-align:center;font-weight:600;cursor:pointer;font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.res{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--surface)}
.res button{border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:10px 12px;cursor:pointer}
.res button:first-child{border-top:0}
.summary{display:flex;justify-content:space-between;gap:10px;background:var(--surface2);border-radius:12px;padding:10px 12px;font-weight:600}
.pkopt{display:flex;flex-direction:column;gap:6px;background:var(--accent-soft);border-radius:12px;padding:10px 12px}
.pkopt .lb{font-size:13px;font-weight:700;color:var(--accent)}
.sheet-foot{position:sticky;bottom:calc(-20px - env(safe-area-inset-bottom,0px));background:var(--bg);padding:12px 0 4px;margin-top:14px;display:flex;gap:8px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.colors{display:flex;gap:8px;flex-wrap:wrap}
.colors button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;background:var(--c);cursor:pointer}
.colors button[aria-pressed="true"]{border-color:var(--fg)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:11px}
.switch input{width:22px;height:22px;accent-color:var(--accent)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:600;margin-bottom:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--surface2);padding:1px 5px;border-radius:6px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
.login{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.login h2{font-size:26px}
.sync{font-size:11.5px;color:var(--muted);text-align:center;margin-top:18px}
pre.codigo{background:var(--surface2);border-radius:10px;padding:10px;font-size:11.5px;max-height:160px;overflow:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><div class="eyebrow" id="eyebrow">Agenda</div><h1 id="htitle">Carregando…</h1></div>
  <div class="whoami" id="whoami" hidden></div>
</header>
<main id="main"><div class="empty"><b>Abrindo a agenda</b>Buscando atendimentos, clientes e pacotes.</div></main>
<nav class="tabs" id="tabs" aria-label="Seções"></nav>
<div id="sheetWrap" hidden><div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheet"></div></div></div>
<div id="toast" hidden></div>

<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s,n) => { const d = parseD(s); d.setDate(d.getDate()+n); return isoD(d); };
const today = () => isoD(new Date());
const wd = s => parseD(s).getDay();
const toMin = h => { if(!h) return null; const [a,b] = h.split(':').map(Number); return a*60+b; };
const toHM = m => `${pad(Math.floor(m/60))}:${pad(m%60)}`;
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes(); };
const daysBetween = (a,b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const DW = ['dom','seg','ter','qua','qui','sex','sáb'];
const DWL = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MESL = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const fmtDia = s => { const d = parseD(s); return `${DW[d.getDay()]}, ${d.getDate()} ${MES[d.getMonth()]}`; };
const fmtLongo = s => { const d = parseD(s); return `${DWL[d.getDay()].toLowerCase()}, ${d.getDate()} de ${MESL[d.getMonth()]}`; };
const fmtCurto = s => { const d = parseD(s); return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`; };
const brl = v => (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const num = v => { const n = parseFloat(String(v ?? '').replace(/\./g,'').replace(',','.')); return isNaN(n) ? 0 : n; };
const numIn = v => { const s = String(v ?? '').trim(); if(!s) return 0; return s.includes(',') ? num(s) : (parseFloat(s) || 0); };
const rnd = () => Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,10);
const FORMAS = {pix:'Pix', dinheiro:'Dinheiro', cartao:'Cartão'};
const FORMAS_PG = {...FORMAS, vale:'Vale (prêmio)'};
const CAT_SAIDA = ['Produtos','Aluguel de máquina','Aluguel do espaço','Contas','Outros'];
const STATUS = {agendado:['Agendado',''], confirmado:['Confirmado','ok'], concluido:['Concluído','acc'], faltou:['Faltou','warn'], cancelado:['Cancelado','bad']};
const CORES = ['#C2185B','#E0607E','#8E44AD','#3F6FD8','#1E9E8F','#3E9A3E','#D98A00','#A0522D'];

const ICON = {
  agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M3 9.5h18M8 3v3M16 3v3"/></svg>',
  msg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 0 1-11.7 7.1L4 20l1-4.1A8 8 0 1 1 20 12z"/><path d="M9 11h6M9 14h4"/></svg>',

/* ---------- regras de negócio ---------- */
function horario(p, date){
  const c = C(); const h = p && p.horarioProprio ? p : c;
  const dias = h.dias || c.dias;
  if(!dias.includes(wd(date))) return null;
  return {ini:toMin(h.inicio || c.inicio), fim:toMin(h.fim || c.fim), almIni:toMin(h.almocoIni), almFim:toMin(h.almocoFim)};
}
const cobre = (b, d) => d >= b.data && d <= (b.ate || b.data);
const bloqsDe = (pid, d) => S.bloqs.filter(b => cobre(b,d) && (!b.profId || b.profId === pid));
function diaAberto(d){ return C().dias.includes(wd(d)) && !S.bloqs.some(b => !b.profId && !b.ini && cobre(b,d)); }
function proxDiaAberto(t){ for(let i=1;i<=30;i++){ const d = addDays(t,i); if(diaAberto(d)) return d; } return addDays(t,1); }
const ativoNaAgenda = a => a.status !== 'cancelado';
const totalAvulso = a => (a.itens||[]).filter(i => !i.pacoteId).reduce((s,i) => s + (Number(i.preco)||0), 0);
const pagoAt = a => (a.pagamentos||[]).reduce((s,p) => s + (Number(p.valor)||0), 0);
const pendAt = a => Math.max(0, +(totalAvulso(a) - pagoAt(a)).toFixed(2));
const somaVals = K => Object.values(K.vals||{}).reduce((s,v) => s + numIn(v), 0);
function textoSoma(v, pend){ const f = +(pend - v).toFixed(2); return `Informado <b class="num">${brl(v)}</b> de ${brl(pend)}${f > 0.004 ? ` · falta <b class="num" style="color:var(--warn)">${brl(f)}</b>` : (f < -0.004 ? ` · <b style="color:var(--bad)">passou ${brl(-f)}</b>` : ' · <b style="color:var(--ok)">completo</b>')}`; }
function pagStatus(a){ const t = totalAvulso(a); if(t <= 0) return ['Pacote','acc']; const p = pagoAt(a); if(p <= 0) return ['Pendente','warn']; if(p + 0.004 < t) return ['Parcial','warn']; return ['Pago','ok']; }
const usadas = p => S.ats.filter(a => a.consumiuPacote && (a.itens||[]).some(i => i.pacoteId === p.id)).length;
function ultimaSessao(p){ const l = S.ats.filter(a => a.consumiuPacote && (a.itens||[]).some(i => i.pacoteId === p.id)).sort((a,b) => (a.data+a.hora).localeCompare(b.data+b.hora)); return l[l.length-1]; }
function proximaData(p){ const u = ultimaSessao(p); return u ? addDays(u.data, Number(p.intervaloDias)||30) : (p.criadoEm || today()); }
const pacAtivos = cid => S.pacs.filter(p => p.clienteId === cid && usadas(p) < p.sessoes);
const sessaoFutura = p => S.ats.some(a => ['agendado','confirmado'].includes(a.status) && a.data >= today() && (a.itens||[]).some(i => i.pacoteId === p.id));
const parcAbertas = p => (p.parcelas||[]).map((x,i) => ({...x, i})).filter(x => !x.pago);
function saldoCliente(cid){
  let v = 0;
  S.ats.filter(a => a.clienteId === cid && a.status === 'concluido').forEach(a => v += pendAt(a));
  S.pacs.filter(p => p.clienteId === cid).forEach(p => parcAbertas(p).forEach(x => v += Number(x.valor)||0));
  return v;
}

function ocupados(pid, date, excl){
  const out = []; const h = horario(prof(pid), date);
  if(h && h.almIni != null && h.almFim != null) out.push({s:h.almIni, e:h.almFim});
  bloqsDe(pid, date).forEach(b => out.push(b.ini ? {s:toMin(b.ini), e:toMin(b.fim)} : {s:0, e:1440}));
  return out;
}
function livres(pid, date, dur, excl, cid){
  const p = prof(pid); const h = horario(p, date); if(!h || !dur) return [];
  const gap = Number(C().intervalo)||0; const blocks = ocupados(pid, date);
  const mine = S.ats.filter(a => a.id !== excl && a.data === date && ativoNaAgenda(a));
  const out = []; const lim = date === today() ? nowMin() : -1;
  for(let t = h.ini; t + dur <= h.fim; t += 15){
    if(t < lim) continue;
    if(blocks.some(b => t < b.e && b.s < t + dur)) continue;
    if(mine.some(a => a.profId === pid && t < toMin(a.hora) + a.duracao + gap && toMin(a.hora) < t + dur + gap)) continue;
    if(cid && mine.some(a => a.clienteId === cid && t < toMin(a.hora) + a.duracao && toMin(a.hora) < t + dur)) continue;
    out.push(toHM(t));
  }
  return out;
}

/* ---------- mensagens ---------- */
const fill = (tpl, ctx) => String(tpl||'').replace(/\{(\w+)\}/g, (m,k) => ctx[k] !== undefined ? ctx[k] : m);
const nomesServ = itens => (itens||[]).map(i => serv(i.servicoId)?.nome || 'serviço').join(' + ');
function linkCliente(a){ return new URL("h.html?t=" + encodeURIComponent(a.token||""), location.href).href; }
function gcal(a){
  const s = a.data.replace(/-/g,'') + 'T' + a.hora.replace(':','') + '00';
  const fimM = toMin(a.hora) + (a.duracao||30); const e = a.data.replace(/-/g,'') + 'T' + toHM(fimM).replace(':','') + '00';
  const p = prof(a.profId);
  const u = new URLSearchParams({action:'TEMPLATE', text:`${nomesServ(a.itens)} · ${C().nomeEspaco}`, dates:`${s}/${e}`, ctz:'America/Sao_Paulo', details:`Atendimento com ${p?.nome||'a profissional'}.`});
  return 'https://calendar.google.com/calendar/render?' + u.toString();
}
function ctxAt(a){
  const c = cli(a.clienteId), p = prof(a.profId);
  const pi = (a.itens||[]).find(i => i.pacoteId); const pk = pi && pac(pi.pacoteId);
  const u = pk ? usadas(pk) : 0;
  return {nome:(c?.nome||'').split(' ')[0], servicos:nomesServ(a.itens), profissional:p?.nome||'', data:fmtLongo(a.data), hora:a.hora, link:linkCliente(a),
    sessao_atual: pk ? String(a.consumiuPacote ? u : u+1) : '', sessoes_restantes: pk ? String(pk.sessoes - u - (a.consumiuPacote?0:1)) : '', valor_pendente:brl(pendAt(a))};
}
function msgConfirm(a){
  const ctx = ctxAt(a);
  if((a.itens||[]).length === 1){ const s = serv(a.itens[0].servicoId); if(s?.msgConfirmacao?.trim()) return fill(s.msgConfirmacao, ctx); }
  return fill(C().msgs.confirmacao, ctx);
}
function ctxPac(p, extra){ const c = cli(p.clienteId); const u = usadas(p); return {nome:(c?.nome||'').split(' ')[0], servicos:serv(p.servicoId)?.nome || p.nome, profissional:'', data:'', hora:'', link:'', sessao_atual:String(u+1), sessoes_restantes:String(p.sessoes-u), valor_pendente:'', ...(extra||{})}; }
function waLink(tel, txt){ let d = String(tel||'').replace(/\D/g,''); if(d && d.length <= 11) d = '55' + d; return `https://wa.me/${d}?text=${encodeURIComponent(txt)}`; }

function filaMsgs(){
  const t = today(), prox = proxDiaAberto(t), out = {conf:[], rem:[], ren:[], pend:[], aniv:[]};
  const reenviar = k => { const m = S.env[k]; return !m || daysBetween(m.em, t) >= 7; };
  S.ats.forEach(a => {
    if(!inProf(a.profId)) return;
    if(a.status === 'agendado' && (a.data === prox || a.data === t) && !S.env['conf__'+a.id]){
      if(a.data === t && toMin(a.hora) < nowMin()) return;
      out.conf.push({key:'conf__'+a.id, tipo:'conf', cli:cli(a.clienteId), titulo:`${fmtDia(a.data)}, ${a.hora} · ${nomesServ(a.itens)}`, late:a.data === t, txt:msgConfirm(a), atId:a.id});
    }
  });
  S.ats.forEach(a => {
    if(a.status !== 'concluido' || !inProf(a.profId)) return;
    const v = pendAt(a); if(v <= 0) return;
    if(a.pagarEm && a.pagarEm > t) return;
    const k = 'pend__'+a.id; if(!reenviar(k)) return;
    const ref = a.pagarEm || a.data;
    out.pend.push({key:k, tipo:'pend', cli:cli(a.clienteId), titulo:`${brl(v)} em aberto · ${nomesServ(a.itens)} de ${fmtCurto(a.data)}${a.pagarEm?` · combinado para ${fmtCurto(a.pagarEm)}`:''}`, late:daysBetween(ref,t) > 7, txt:fill(C().msgs.pendente, {...ctxAt(a), valor_pendente:brl(v)})});
  });
  S.pacs.forEach(p => {
    const lastAt = ultimaSessao(p); if(effProf() !== 'todas' && lastAt && lastAt.profId !== effProf()) return;
    const u = usadas(p);
    if(u < p.sessoes && !sessaoFutura(p) && !(isLaser(p) && diasLaserFuturos().length)){
      const due = proximaData(p);
      if(due <= t && reenviar('rem__'+p.id)) out.rem.push({key:'rem__'+p.id, tipo:'rem', cli:cli(p.clienteId), titulo:`${p.nome} · sessão ${u+1} de ${p.sessoes} · ideal desde ${fmtCurto(due)}`, late:daysBetween(due,t) > 7, txt:fill(C().msgs.proximaSessao, ctxPac(p))});
    }
    if(u === p.sessoes - 1 && !S.env['ren__'+p.id]) out.ren.push({key:'ren__'+p.id, tipo:'ren', cli:cli(p.clienteId), titulo:`${p.nome} · falta 1 sessão`, txt:fill(C().msgs.renovacao, ctxPac(p))});
    if(effProf() === 'todas' || ME.admin) parcAbertas(p).forEach(x => {
      if(x.venc > t) return; const k = `parc__${p.id}__${x.i}`; if(!reenviar(k)) return;
      out.pend.push({key:k, tipo:'pend', cli:cli(p.clienteId), titulo:`Parcela ${x.n} de ${p.parcelas.length} · ${brl(x.valor)} · venceu ${fmtCurto(x.venc)}`, late:daysBetween(x.venc,t) > 7, txt:fill(C().msgs.pendente, ctxPac(p, {valor_pendente:brl(x.valor)}))});
    });
  });
  if(ME.admin || effProf() !== 'nenhuma') S.clis.forEach(c => {
    if(c.aniversario && c.aniversario.slice(-5) === t.slice(5)){
      const k = `aniv__${c.id}__${t.slice(0,4)}`; if(S.env[k]) return;
      out.aniv.push({key:k, tipo:'aniv', cli:c, titulo:'Faz aniversário hoje', txt:fill(C().msgs.aniversario, {nome:(c.nome||'').split(' ')[0]})});
    }
  });
  out.total = out.conf.length + out.rem.length + out.ren.length + out.pend.length + out.aniv.length;
  return out;
}

/* ---------- banco de dados (Supabase) ---------- */
const COLS = {profissionais:'profs', servicos:'servs', clientes:'clis', modelosPacote:'modelos', pacotes:'pacs', bloqueios:'bloqs', atendimentos:'ats', mensagens:'envArr', saidas:'saidas', diasMaquina:'dias'};
const lsGet = k => { try{ return localStorage.getItem('ae_'+k); }catch(_){ return null; } };
const lsSet = (k,v) => { try{ v == null ? localStorage.removeItem('ae_'+k) : localStorage.setItem('ae_'+k, v); }catch(_){ } };
const lsJSON = k => { try{ return JSON.parse(lsGet(k) || 'null'); }catch(_){ return null; } };
const SB_URL = (window.AE_SUPABASE_URL || '').trim(), SB_KEY = (window.AE_SUPABASE_KEY || '').trim();
const sb = (SB_URL && SB_KEY && window.supabase) ? window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true}}) : null;
const API = () => sb ? 'supabase' : '';
let SERVER = {}, STORE = {}, FILA = lsJSON('fila') || [], PERFIS = [];
let enviando = false, seqLeitura = 0, ultimaEscrita = 0, statusSync = '', canal = null, sessao = null;
function mesclar(a, b){ const o = {...a}; for(const k of Object.keys(b)){ const v = b[k]; o[k] = (v && typeof v === 'object' && !Array.isArray(v) && o[k] && typeof o[k] === 'object' && !Array.isArray(o[k])) ? mesclar(o[k], v) : v; } return o; }
function aplicarOp(st, op){ st[op.col] = st[op.col] || {}; if(op.op === 'delete') delete st[op.col][op.id]; else if(op.op === 'update'){ if(st[op.col][op.id]) st[op.col][op.id] = mesclar(st[op.col][op.id], op.data); } else st[op.col][op.id] = op.data; }
function recalcular(){
  STORE = JSON.parse(JSON.stringify(SERVER || {}));
  FILA.forEach(op => aplicarOp(STORE, op));
  for(const [col, key] of Object.entries(COLS)) S[key] = Object.entries(STORE[col] || {}).map(([id, d]) => ({...d, id}));
  S.env = Object.fromEntries(S.envArr.map(m => [m.id, m]));
  S.cfg = (STORE.config || {}).geral || {};
  schedule();
}
function salvarCache(){ try{ localStorage.setItem('ae_cache', JSON.stringify(SERVER)); }catch(_){ } }
async function carregarPerfil(){
  const {data:{session}} = await sb.auth.getSession(); sessao = session;
  if(!session){ return false; }
  ME.id = session.user.id;
  const {data:ps} = await sb.from('perfis').select('user_id,nome,perfil,aprovado').order('nome');
  PERFIS = ps || [];
  const eu = PERFIS.find(p => p.user_id === ME.id);
  ME.admin = !!eu && eu.perfil === 'admin' && eu.aprovado;
  ME.aprovado = !!eu && eu.aprovado;
  lsSet('nome', eu?.nome || session.user.email); lsSet('perfil', eu?.perfil || 'profissional');
  return true;
}
async function carregar(){
  if(!sb || !db) return;
  const meu = ++seqLeitura, inicio = Date.now();
  try{
    await carregarPerfil();
    const novo = {}; let de = 0;
    while(true){
      const {data, error} = await sb.from('registros').select('colecao,id,dados').range(de, de + 999);
      if(error) throw error;
      (data || []).forEach(r => { (novo[r.colecao] = novo[r.colecao] || {})[r.id] = r.dados; });
      if(!data || data.length < 1000) break; de += 1000;
    }
    if(meu !== seqLeitura || inicio < ultimaEscrita) return;
    SERVER = novo; salvarCache();
    statusSync = 'Atualizado às ' + new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
    S.ready = true; recalcular();
  }catch(e){ statusSync = 'Sem conexão. Mostrando a última cópia salva no aparelho.'; if(!S.ready && Object.keys(SERVER).length){ S.ready = true; recalcular(); } else schedule(); }
}
function ouvirMudancas(){
  if(canal || !sb) return;
  canal = sb.channel('registros-ao-vivo').on('postgres_changes', {event:'*', schema:'public', table:'registros'}, p => {
    const r = p.eventType === 'DELETE' ? p.old : p.new; if(!r || !r.colecao) return;
    SERVER[r.colecao] = SERVER[r.colecao] || {};
    if(p.eventType === 'DELETE') delete SERVER[r.colecao][r.id]; else SERVER[r.colecao][r.id] = r.dados;
    salvarCache(); recalcular();
  }).subscribe();
}
async function enviarFila(){
  if(enviando || !FILA.length || !sb || !db) return;
  enviando = true;
  try{
    while(FILA.length){
      const op = FILA[0]; let error = null;
      if(op.op === 'delete'){ ({error} = await sb.from('registros').delete().match({colecao:op.col, id:op.id})); }
      else {
        let dados = op.op === 'update' ? (STORE[op.col] || {})[op.id] : op.data;
        if(op.op === 'update' && !dados) dados = mesclar((SERVER[op.col] || {})[op.id] || {}, op.data);
        ({error} = await sb.from('registros').upsert({colecao:op.col, id:op.id, dados, token:dados?.token || null, atualizado_em:new Date().toISOString()}));
      }
      if(error){
        if(!error.code || /fetch|network/i.test(error.message || '')) throw error;
        FILA.shift(); lsSet('fila', JSON.stringify(FILA));
        toast(error.code === '42501' ? 'Só a administração pode alterar isso.' : 'Não foi possível salvar: ' + (error.message || 'erro'));
        setTimeout(carregar, 300); continue;
      }
      aplicarOp(SERVER, op.op === 'update' ? {...op, op:'set', data:(STORE[op.col] || {})[op.id] || op.data} : op);
      FILA.shift(); lsSet('fila', JSON.stringify(FILA));
      ultimaEscrita = Date.now(); statusSync = 'Salvo';
    }
    salvarCache();
  }catch(e){ statusSync = 'Sem conexão. ' + FILA.length + ' alteração(ões) aguardando envio.'; setTimeout(enviarFila, 15000); }

function semIni(d){ const w = wd(d); return addDays(d, w === 0 ? -6 : 1 - w); }
function semana(d){

  }

function timeline(date){
  const ps = visibleProfs(); const c = C();
  const hs = ps.map(p => horario(p,date)).filter(Boolean);
  let ini = hs.length ? Math.min(...hs.map(x => x.ini)) : toMin(c.inicio), fim = hs.length ? Math.max(...hs.map(x => x.fim)) : toMin(c.fim);
  const dayAts = S.ats.filter(a => a.data === date && ps.some(p => p.id === a.profId));
  dayAts.forEach(a => { ini = Math.min(ini, toMin(a.hora)); fim = Math.max(fim, toMin(a.hora) + a.duracao); });
  ini = Math.floor(ini/60)*60; fim = Math.ceil(fim/60)*60;
  const PX = 1.35, H = (fim-ini)*PX;
  let hours = ''; for(let m = ini; m <= fim; m += 60) hours += `<span class="num" style="top:${36 + (m-ini)*PX}px">${pad(m/60)}h</span>`;
  let cols = '';
  ps.forEach(p => {
    const h = horario(p, date); let inner = '';
    const off = (s,e,t) => { s = Math.max(s,ini); e = Math.min(e,fim); if(e<=s) return ''; return `<div class="tl-off" style="top:${(s-ini)*PX}px;height:${(e-s)*PX}px">${esc(t)}</div>`; };
    if(!h) inner += off(ini, fim, 'Folga');
    else {
      inner += off(ini, h.ini, '') + off(h.fim, fim, '');
      if(h.almIni != null && h.almFim != null) inner += off(h.almIni, h.almFim, 'Almoço');
    }
    bloqsDe(p.id, date).forEach(b => inner += b.ini ? off(toMin(b.ini), toMin(b.fim), b.motivo || 'Bloqueado') : off(ini, fim, b.motivo || 'Bloqueado'));
    dayAts.filter(a => a.profId === p.id).sort((a,b) => (a.status==='cancelado') - (b.status==='cancelado')).forEach(a => {
      const s = serv(a.itens?.[0]?.servicoId); const top = (toMin(a.hora)-ini)*PX, hh = Math.max(a.duracao*PX, 30);
      const pk = (a.itens||[]).some(i => i.pacoteId);
      inner += `<div class="tl-at ${a.status}" style="--c:${esc(s?.cor||'#999')};top:${top}px;height:${hh}px" data-a="verAt" data-id="${a.id}"><b>${a.hora} ${esc(cli(a.clienteId)?.nome||'Cliente')}</b><div class="m">${esc(nomesServ(a.itens))}${pk?' · pacote':''} · ${STATUS[a.status]?.[0]||''}</div></div>`;
    });
    if(date === today() && nowMin() > ini && nowMin() < fim) inner += `<div class="tl-now" style="top:${(nowMin()-ini)*PX}px"></div>`;
    cols += `<div class="tl-col"><div class="tl-head"><span class="dot" style="--c:${esc(p.cor)}"></span>${esc(p.nome)}</div><div class="tl-body" style="height:${H}px;--hour:${60*PX}px" data-a="slot" data-p="${p.id}" data-ini="${ini}" data-px="${PX}">${inner}</div></div>`;
  });
  return `<div class="tl-wrap"><div class="tl"><div class="tl-hours" style="height:${H+36}px">${hours}</div>${cols}</div></div><p class="muted small" style="margin:8px 2px 0">Toque num espaço livre para agendar naquele horário.</p>`;
}

function statusDia(d){
  const out = {agendadas:[], convidadas:[], convidar:[]};
  S.pacs.filter(p => isLaser(p) && usadas(p) < p.sessoes).forEach(p => {
    const at = S.ats.find(a => a.data === d.data && a.status !== 'cancelado' && (a.itens||[]).some(i => i.pacoteId === p.id));
    const item = {p, at, cli:cli(p.clienteId), ideal:proximaData(p), u:usadas(p)};
    if(at) out.agendadas.push(item);
    else if(S.env[`laser__${d.id}__${p.id}`]) out.convidadas.push(item);
    else out.convidar.push(item);
  });
  out.agendadas.sort((a,b) => a.at.hora.localeCompare(b.at.hora));
  out.convidar.sort((a,b) => a.ideal.localeCompare(b.ideal));
  return out;
}

/* ---------- Financeiro ---------- */
function calcFin(mes){
  const pf = effProf(); const t = today();
  const r = {mes:0, hoje:0, porForma:{pix:0,dinheiro:0,cartao:0}, porProf:{}, pacVend:0, pacVendN:0, receber:0, receberItens:[], vales:0, saidas:0, saidasItens:[], porCat:{}};
  activeProfs().forEach(p => r.porProf[p.id] = {n:0, avulso:0, sessoes:0, sessVal:0, vales:0});
  S.ats.forEach(a => {
    if(!inProf(a.profId)) return;
    (a.pagamentos||[]).forEach(pg => {
      const v = +pg.valor||0;
      if(pg.forma === 'vale'){ if((pg.em||'').startsWith(mes)){ r.vales += v; const q = r.porProf[pg.profVale || a.profId]; if(q) q.vales += v; } return; }
      if((pg.em||'').startsWith(mes)){ r.mes += v; r.porForma[pg.forma] = (r.porForma[pg.forma]||0) + v; if(r.porProf[a.profId]) r.porProf[a.profId].avulso += v; }
      if(pg.em === t) r.hoje += v;
    });
    if(a.data.startsWith(mes) && a.status === 'concluido' && r.porProf[a.profId]) r.porProf[a.profId].n++;
    if(a.data.startsWith(mes) && a.consumiuPacote && r.porProf[a.profId]){
      (a.itens||[]).filter(i => i.pacoteId).forEach(i => { const p = pac(i.pacoteId); if(p){ r.porProf[a.profId].sessoes++; r.porProf[a.profId].sessVal += (Number(p.valor)||0)/(p.sessoes||1); } });
    }
    if(a.status === 'concluido'){ const v = pendAt(a); if(v > 0){ r.receber += v; r.receberItens.push({cli:cli(a.clienteId), txt:`${nomesServ(a.itens)} · ${fmtCurto(a.data)}${a.pagarEm?` · combinado para ${fmtCurto(a.pagarEm)}`:''}`, v}); } }
  });
  if(pf === 'todas'){
    S.pacs.forEach(p => {
      if((p.criadoEm||'').startsWith(mes)){ r.pacVend += Number(p.valor)||0; r.pacVendN++; }
      (p.parcelas||[]).forEach(x => {
        if(x.pago){ if((x.pagoEm||'').startsWith(mes)){ r.mes += +x.valor||0; r.porForma[x.forma||p.forma] = (r.porForma[x.forma||p.forma]||0) + (+x.valor||0); } if(x.pagoEm === t) r.hoje += +x.valor||0; }
        else { r.receber += +x.valor||0; r.receberItens.push({cli:cli(p.clienteId), txt:`${p.nome} · parcela ${x.n} · vence ${fmtCurto(x.venc)}`, v:+x.valor||0}); }
      });
    });
    S.saidas.filter(s => (s.data||'').startsWith(mes)).forEach(s => { const v = +s.valor||0; r.saidas += v; r.porCat[s.categoria] = (r.porCat[s.categoria]||0) + v; r.saidasItens.push(s); });
    r.saidasItens.sort((a,b) => (b.data||'').localeCompare(a.data||''));
  }
  return r;
}

  if(espaco && ME.admin){
    h += `<div class="sec-title">Saídas<span class="count num">${r.saidasItens.length}</span></div>`;
    if(canWrite) h += `<button class="btn wide" data-a="formSaida">${ICON.plus}Registrar saída</button>`;
    const cats = Object.entries(r.porCat).sort((a,b) => b[1]-a[1]);
    if(cats.length) h += `<div class="tbl-wrap" style="margin-top:10px"><table><tbody>${cats.map(([c,v]) => `<tr><td>${esc(c)}</td><td class="r num">${brl(v)}</td></tr>`).join('')}</tbody></table></div>`;
    h += r.saidasItens.length ? `<div class="list" style="margin-top:10px">${r.saidasItens.map(s => `<button class="li" data-a="formSaida" data-id="${s.id}"><span class="grow"><span class="t">${esc(s.descricao||s.categoria)}</span><br><span class="s num">${fmtCurto(s.data)} · ${esc(s.categoria)} · ${esc(FORMAS[s.forma]||'')}</span></span><b class="num" style="color:var(--bad)">− ${brl(s.valor)}</b></button>`).join('')}</div>` : `<div class="empty" style="margin-top:10px">Nenhuma saída neste mês. Registre compras de produtos, aluguel da máquina e outras despesas.</div>`;
  }
  h += `<div class="sec-title">A receber<span class="count num">${r.receberItens.length}</span></div>`;
  h += r.receberItens.length ? `<div class="list">${r.receberItens.sort((a,b)=>b.v-a.v).map(x => `<div class="li" style="cursor:default"><span class="grow"><span class="t">${esc(x.cli?.nome||'Cliente')}</span><br><span class="s">${esc(x.txt)}</span></span><b class="num">${brl(x.v)}</b></div>`).join('')}</div>` : `<div class="empty">Nada em aberto.</div>`;

function lerPacForm(){ const P = SH.p; const g = id => $('#'+id);
  if(g('p-nome')) P.nome = g('p-nome').value; if(g('p-serv')) P.servicoId = g('p-serv').value; if(g('p-ses')) P.sessoes = parseInt(g('p-ses').value)||0; if(g('p-int')) P.intervaloDias = parseInt(g('p-int').value)||0;
  if(g('p-val')) P.valor = numIn(g('p-val').value); if(g('p-nmq')) P.nMaquininha = parseInt(g('p-nmq').value)||1; if(g('p-np')) P.nParc = parseInt(g('p-np').value)||2; if(g('p-v1')) P.venc1 = g('p-v1').value; if(g('p-entrada')) P.entradaPaga = g('p-entrada').checked; }
function addMes(s, n){ const d = parseD(s); const dia = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const ult = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(dia, ult)); return isoD(d); }
async function salvarPac(){
  lerPacForm(); const P = SH.p; const t = today();
  if(!P.nome.trim()) return toast('Dê um nome ao pacote.'); if(!P.servicoId) return toast('Escolha o serviço das sessões.');
  if(P.sessoes < 1) return toast('Informe a quantidade de sessões.'); if(P.valor <= 0) return toast('Informe o valor do pacote.');
  let parcelas;
  if(P.forma === 'cartao') parcelas = [{n:1, valor:P.valor, venc:t, pago:true, pagoEm:t, forma:'cartao'}];
  else if(P.tipoPag === 'avista') parcelas = [{n:1, valor:P.valor, venc:t, pago:true, pagoEm:t, forma:P.forma}];
  else {
    const n = Math.max(2, P.nParc); const cents = Math.round(P.valor*100); const base = Math.floor(cents/n);
    parcelas = Array.from({length:n}, (_,i) => { const v = (i === n-1 ? cents - base*(n-1) : base)/100; const venc = addMes(P.venc1 || t, i); const pago = i === 0 && P.entradaPaga; return {n:i+1, valor:v, venc, pago, pagoEm:pago?t:null, forma:P.forma}; });
  }
  const doc = {clienteId:P.clienteId, servicoId:P.servicoId, modeloId:P.modeloId||null, nome:P.nome.trim(), sessoes:P.sessoes, intervaloDias:P.intervaloDias||30, valor:P.valor, forma:P.forma,
    tipoPag:P.forma==='cartao'?'maquininha':P.tipoPag, nMaquininha:P.forma==='cartao'?P.nMaquininha:null, parcelas, criadoEm:t, criadoPor:ME.id||null};
  if(await put('pacotes', novoId('pacotes'), doc)){ closeSheet(); toast('Pacote cadastrado.'); }
}

document.addEventListener('submit', async e => {

  e.preventDefault();
  const email = $('#lg-email').value.trim(), senha = $('#lg-senha').value;
  const b = $('#lg-btn'), m = $('#lg-msg'); b.disabled = true; m.textContent = 'Conferindo…';
  try{
    if(modoLogin === 'criar'){
      const nome = $('#lg-nome').value.trim();
      const {data, error} = await sb.auth.signUp({email, password:senha, options:{data:{nome}, emailRedirectTo:location.origin + location.pathname}});
      if(error){ m.textContent = /registered|exists/i.test(error.message) ? 'Esse e-mail já tem acesso. Toque em "entrar".' : 'Não foi possível criar: ' + error.message; b.disabled = false; return; }
      if(!data.session){ modoLogin = 'entrar'; render(); toast('Enviamos um e-mail de confirmação. Confirme e depois entre aqui.'); return; }
    } else {
      const {error} = await sb.auth.signInWithPassword({email, password:senha});
      if(error){ m.textContent = /confirm/i.test(error.message) ? 'Confirme seu e-mail antes de entrar (veja a caixa de entrada e o spam).' : (/invalid/i.test(error.message) ? 'E-mail ou senha incorretos.' : 'Não foi possível entrar: ' + error.message); b.disabled = false; return; }
    }
    db = true; canWrite = true; await carregarPerfil(); render(); if(ME.aprovado){ ouvirMudancas(); carregar(); }
  }catch(_){ m.textContent = 'Não consegui falar com o banco de dados. Confira a internet e tente de novo.'; b.disabled = false; }
});

    if(!K.adiantado && parc(antes) !== parc(agora)){ const pos = e.target.selectionStart; renderSheetKeep(); const n = $('#'+id); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
  }
  else if(id === 'sd-val' && SH){ SH.v = e.target.value; }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if(id === 'dpick' && e.target.value){ U.date = e.target.value; e.target.blur(); render(); }
  else if(id === 'f-data' && e.target.value){ F.data = e.target.value; F.hora = null; renderSheetKeep(); }
  else if(id === 'pg-d' && SH && SH.cp){ SH.cp.d = e.target.value; }
});
document.addEventListener('focusout', () => setTimeout(() => { if(dirty && !focoEm('#main')) render(); }, 0));
document.addEventListener('keydown', e => { if(e.key === 'Escape' && SH) closeSheet(); });
setInterval(() => { if(U.view === 'agenda' || U.view === 'msgs') schedule(); }, 60000);

/* ---------- início ---------- */
async function boot(){
  render();
  if(!sb){ render(); return; }
  const {data:{session}} = await sb.auth.getSession();
  if(session){
    db = true; ME.id = session.user.id; ME.admin = lsGet('perfil') === 'admin';
    const cache = lsJSON('cache');
    if(cache){ SERVER = cache; S.ready = true; recalcular(); statusSync = 'Mostrando a cópia salva no aparelho. Atualizando…'; }
    render(); await carregarPerfil(); render(); if(ME.aprovado){ ouvirMudancas(); carregar(); enviarFila(); }
  } else render();
  sb.auth.onAuthStateChange((ev) => { if(ev === 'SIGNED_OUT' && db){ db = null; S.ready = false; render(); } });
  setInterval(() => { if(document.visibilityState === 'visible' && db){ enviarFila(); carregar(); } }, 60000);
  document.addEventListener('visibilitychange', () => { if(document.visibilityState === 'visible' && db){ enviarFila(); carregar(); } });
  window.addEventListener('online', () => { if(db){ enviarFila(); carregar(); } });
}
boot();
</script>
