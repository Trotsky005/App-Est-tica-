<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Configurar Agenda</title>
<style>
:root{--bg:#F7F3F6;--surface:#fff;--line:#E3D9E0;--fg:#261B28;--muted:#75667A;--accent:#B02D58;--ok:#2B7868}
@media (prefers-color-scheme: dark){:root{--bg:#141016;--surface:#1E1721;--line:#3A303D;--fg:#F3ECF4;--muted:#A796AB;--accent:#EE7299;--ok:#5EC4AE;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
main{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:24px;margin:0}
.btn{display:block;width:100%;min-height:56px;border-radius:14px;border:0;background:var(--accent);color:#fff;font:700 17px system-ui,sans-serif;cursor:pointer}
.ok{color:var(--ok);font-weight:700;text-align:center}
textarea{width:100%;height:160px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);font:12px ui-monospace,monospace;padding:10px;box-sizing:border-box}
p{margin:0;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Código do banco de dados</h1>
<p>Toque no botão para copiar o código inteiro. Depois cole no SQL Editor do Supabase e toque em Run.</p>
<button class="btn" id="b" disabled>Carregando…</button>
<div class="ok" id="m" hidden>Copiado! Agora volte ao Supabase e cole no SQL Editor.</div>
<p>Se o botão não copiar, toque dentro da caixa abaixo, segure, escolha "Selecionar tudo" e depois "Copiar".</p>
<textarea id="t" readonly></textarea>
</main>
<script>
const b = document.getElementById('b'), t = document.getElementById('t'), m = document.getElementById('m');
fetch('supabase/banco.sql').then(r => r.text()).then(c => { t.value = c; b.disabled = false; b.textContent = 'Copiar código'; })
  .catch(() => { b.textContent = 'Não carregou. Recarregue a página.'; });
b.onclick = async () => {
  try { await navigator.clipboard.writeText(t.value); }
  catch(_) { t.focus(); t.select(); document.execCommand('copy'); }
  m.hidden = false;
};
</script>
</body>
</html>
